<!DOCTYPE html>
<html lang="en">

<head>
    <title>OCS Room Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>OCS IITH Room Booking</h1>

        <div class="tabs">

            <button onclick="showTab('bookingTab')">
                New Booking
            </button>

            <button onclick="showTab('viewTab')">
                View Bookings
            </button>

        </div>


        <div id="bookingTab">

            <div class="form-group">
                <label>Room</label>
                <select id="room"></select>
            </div>


            <div class="form-group">
                <label>Booking Purpose</label>
                <select id="purpose">

                    <option value="OA">
                        Online Assessment
                    </option>

                    <option value="Interview">
                        Interview
                    </option>

                    <option value="PPT">
                        PPT
                    </option>

                </select>
            </div>


            <div class="form-group">
                <label>Date</label>
                <input type="date" id="date">
            </div>


            <div class="form-group">
                <label>Start Time</label>
                <input type="time" id="startTime">
            </div>


            <div class="form-group">
                <label>End Time</label>
                <input type="time" id="endTime">
            </div>


            <div class="form-group">
                <label>Participants</label>
                <input type="number" id="participants">
            </div>


            <button onclick="bookRoom()">
                Book Room
            </button>


            <div id="message"></div>

        </div>



        <div id="viewTab" style="display:none;">
            <h2>All Bookings</h2>

            <div class="form-group">

                <label>Filter By Purpose</label>
                <select id="filterPurpose"
                        onchange="filterBookings()">

                    <option value="All">
                        All
                    </option>

                    <option value="OA">
                        OA
                    </option>

                    <option value="Interview">
                        Interview
                    </option>

                    <option value="PPT">
                        PPT
                    </option>

                </select>

            </div>

            <div id="bookingsContainer"></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
